name: publish

# 打 v* tag（或手动触发）→ 校验 + 测试 → 发布 npm → 建 GitHub Release。
# 本地流程：npm version patch && git push --follow-tags
#
# 发布走 npm Trusted Publishing（npmjs 包设置里绑定了本仓库 + 本 workflow）：
# OIDC 身份直发，无需 NPM_TOKEN secret。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 建 GitHub Release
  id-token: write # npm provenance / trusted publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Check & test
        run: |
          npm run check
          npm test

      - name: Skip if version already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.check.outputs.skip != 'true'
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
